<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ToolDesk" />
    <meta name="description" content="ToolDesk — 33+ powerful browser-based tools. Password generator, image studio, background remover, PDF toolkit, video tools and more. No installs, 100% private." />
    <meta name="keywords" content="online tools, password generator, image resizer, bg remover, unit converter, text tools, video transcriber, screenshot extractor, tooldesk, tool desk" />
    <meta name="theme-color" content="#4F8EF7" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="ToolDesk — All Tools in Your Browser" />
    <meta property="og:description" content="33+ powerful browser-based tools. No installs, no accounts, no uploads." />
    <meta property="og:image" content="/logo-tooldesk.png" />
    <title>ToolDesk — All Tools in Your Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <script>
      // Capture PWA install prompt as early as possible before any components mount
      window.__tooldeskInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__tooldeskInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('tooldesk-install-ready', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__tooldeskInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('tooldesk-installed'));
      });
    </script>
    <style>
      #root { min-height: 100vh; }
      body { background: #fff; color: #0d0d1a; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d0d1a; color: #f8f9fa; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
